<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fa" />
  <meta name="description" content="A quiet, minimal weekly routine for classes, independent learning, research and life." />
  <title>Momentum — My Weekly Routine</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      font-synthesis: none;
      --bg: #f7f8fa;
      --card: #ffffff;
      --ink: #1b222c;
      --muted: #687383;
      --subtle: #929aa7;
      --line: #e8eaee;
      --blue: #4b6e9f;
      --blue-soft: #f0f5fc;
      --green: #357d69;
      --purple: #7969a5;
      --amber: #a97938;
      --sport: #468d6a;
      --personal: #8793a3;
      --shadow: 0 12px 36px rgba(31, 47, 72, .035), 0 1px 3px rgba(31, 47, 72, .025);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); min-width: 320px; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #8bb1ed; outline-offset: 3px; }
    .container { width: min(1090px, calc(100% - 48px)); margin: 0 auto; }
    .days-section { padding: 28px 0 27px; }
    .daystrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap:9px; }
    .day { position:relative; background:#fff; border:1px solid var(--line); border-radius:16px; padding:15px 8px 14px; text-align:center; transition: border-color .16s, box-shadow .16s, transform .16s; min-height:83px; }
    .day:hover { border-color:#b8c8db; transform:translateY(-1px); }
    .day[aria-pressed="true"] { border-color:#94aac7; background:#f7faff; box-shadow: 0 0 0 1px rgba(96,135,182,.09) inset; }
    .day-name { display:block; font-size:13px; font-weight:680; color:#3d4857; }
    .day-sub { display:block; font-size:11px; color:var(--subtle); margin-top:7px; font-variant-numeric:tabular-nums; }
    .today-dot { position:absolute; top:8px; right:9px; height:5px; width:5px; border-radius:50%; background:#6288b5; }
    .content { display:grid; grid-template-columns: minmax(0, 1.65fr) minmax(250px, .85fr); gap:23px; align-items:start; padding-bottom: 74px; }
    .main-col { min-width:0; }
    .focus-card { background:#fff; padding:27px 29px 25px; border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); margin-bottom:20px; }
    .section-kicker { font-size:10px; text-transform:uppercase; letter-spacing:.15em; color:var(--blue); font-weight:790; }
    .focus-name { font-size:clamp(22px,3vw,30px); letter-spacing:-.047em; font-weight:710; margin:9px 0 7px; line-height:1.18; }
    .focus-time { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
    .focus-footer { margin-top:22px; padding-top:17px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .next-label { text-transform:uppercase; font-size:10px; letter-spacing:.1em; color:var(--subtle); font-weight:770; }
    .next-text { margin-top:4px; color:#485464; font-size:12px; line-height:1.45; }
    .live-indicator { flex-shrink:0; display:flex; align-items:center; gap:6px; color:var(--green); font-size:11px; font-weight:750; }
    .live-indicator::before { content:""; width:6px; height:6px; background: currentColor; border-radius:50%; }
    .schedule { background:#fff; border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); overflow:hidden; }
    .schedule-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:25px 27px 17px; }
    h2 { margin:0; font-size:19px; font-weight:710; letter-spacing:-.035em; }
    .count { font-size:11px; color:var(--subtle); }
    .events { padding:0 16px 14px; }
    .event { display:grid; grid-template-columns: 112px 12px minmax(0,1fr); gap:12px; align-items:center; min-height:66px; padding:10px 10px; border-radius:12px; position:relative; }
    .event + .event { border-top:1px solid #f1f2f4; border-top-left-radius:0; border-top-right-radius:0; }
    .event.is-current { background:#f1f6fd; border-top-color:transparent; border-radius:12px; }
    .event.is-current + .event { border-top-color:transparent; }
    .time { font-size:11px; color:#8290a0; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.6; white-space:nowrap; }
    .line { width:3px; align-self:stretch; min-height:25px; max-height:35px; justify-self:center; border-radius:4px; background:#d3dbe4; }
    .type-learning .line { background:var(--purple); }
    .type-class .line { background:var(--blue); }
    .type-research .line { background:var(--green); }
    .type-homework .line { background:var(--amber); }
    .type-soccer .line { background:var(--sport); }
    .event-title { font-size:13px; line-height:1.38; letter-spacing:-.01em; font-weight:590; }
    .event-note { display:block; font-size:11px; color:var(--subtle); margin-top:3px; line-height:1.35; }
    .event.is-current .event-title { color:#264e85; }
    .aside { position:sticky; top:22px; display:grid; gap:16px; }
    .sidebar-card { background:#fff; border:1px solid var(--line); border-radius:21px; padding:24px; box-shadow:var(--shadow); }
    .side-head { margin:0 0 23px; font-size:14px; font-weight:720; letter-spacing:-.025em; }
    .metric { margin-bottom:21px; }
    .metric:last-of-type { margin-bottom:0; }
    .metric-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:12px; }
    .metric-head span:first-child { color:#657181; }
    .metric-head strong { font-size:13px; color:#2e3c4d; font-weight:710; font-variant-numeric:tabular-nums; }
    .bar { height:5px; border-radius:10px; background:#eff1f4; overflow:hidden; margin-top:9px; }
    .fill { height:100%; border-radius:10px; transition:width .2s ease; }
    .learning-fill { background:#9a88c2; }
    .research-fill { background:#72a99a; }
    .homework-fill { background:#c8ac7f; }
    .quick-note { margin-top:20px; padding-top:18px; border-top:1px solid var(--line); color:#788494; font-size:11px; line-height:1.6; }
    @media (max-width:800px) {
      .container { width:min(670px,calc(100% - 36px)); }
      .daystrip { gap:6px; }
      .day { min-height:74px; padding:13px 4px; border-radius:13px; }
      .day-sub { font-size:10px; }
      .content { grid-template-columns:1fr; gap:16px; }
      .aside { display:none; }
      .sidebar-card { padding:21px 23px; }
      .sidebar-card.metrics-card { display:none; }
      .focus-card { margin-bottom:16px; }
    }
    @media (max-width:460px) {
      .container { width:calc(100% - 28px); }
      .days-section { padding:12px 0 20px; }
      .daystrip { gap:5px; }
      .day { min-height:66px; padding:12px 1px 10px; border-radius:12px; }
      .day-name { font-size:12px; }
      .day-sub { font-size:9px; margin-top:5px; }
      .today-dot { width:4px; height:4px; right:5px; top:5px; }
      .focus-card { border-radius:19px; padding:23px 21px 21px; }
      .schedule { border-radius:19px; }
      .schedule-top { padding:22px 18px 12px; }
      .events { padding:0 7px 10px; }
      .event { grid-template-columns:84px 8px minmax(0,1fr); gap:9px; padding:10px 8px; min-height:65px; }
      .time { font-size:10px; letter-spacing:-.04em; }
      .event-title { font-size:12px; }
      .event-note { font-size:10px; }
      .sidebar-card { padding:20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior:auto!important; transition:none!important; animation:none!important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <main id="top">

      <section class="days-section" aria-label="Select day of the week">
        <nav class="daystrip" id="dayStrip"></nav>
      </section>

      <div class="content">
        <div class="main-col">
          <section class="focus-card" aria-label="Current or featured activity">
            <div class="section-kicker" id="focusLabel">Right now</div>
            <h2 class="focus-name" id="focusName">—</h2>
            <div class="focus-time" id="focusTime">—</div>
            <div class="focus-footer">
              <div>
                <div class="next-label" id="nextLabel">Up next</div>
                <div class="next-text" id="nextText">—</div>
              </div>
              <span class="live-indicator" id="liveTag" hidden>Live</span>
            </div>
          </section>
          <section class="schedule" aria-label="Schedule for selected day">
            <div class="schedule-top"><h2 id="scheduleHeading">Today's schedule</h2><span class="count" id="scheduleCount"></span></div>
            <div class="events" id="events"></div>
          </section>
        </div>
        <aside class="aside" aria-label="Schedule overview">
          <section class="sidebar-card metrics-card">
            <h2 class="side-head">Your time, intentionally</h2>
            <div class="metric"><div class="metric-head"><span>Independent learning</span><strong id="learningTotal">4h</strong></div><div class="bar"><div class="fill learning-fill" id="learningBar"></div></div></div>
            <div class="metric"><div class="metric-head"><span>Research</span><strong id="researchTotal">0h</strong></div><div class="bar"><div class="fill research-fill" id="researchBar"></div></div></div>
            <div class="metric"><div class="metric-head"><span>Homework</span><strong id="homeworkTotal">1h</strong></div><div class="bar"><div class="fill homework-fill" id="homeworkBar"></div></div></div>
            <div class="quick-note">Every day has at least 4 hours for DSA, PyTorch, or deep learning mathematics—separate from research and classes. Homework stays at 1 hour or less.</div>
          </section>
        </aside>
      </div>
    </main>
  </div>
  <script>
    "use strict";
    // Edit the schedule here. Days are Monday (0) through Sunday (6).
    // Each item is [start in 24h, end in 24h, title, category, optional note].
    // Sleep ends the next morning, represented by an end time earlier than the start.
    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const schedule = [
      // MONDAY — 4 hours independent learning, 1 hour homework, 1 hour research
      [
        ["07:30","08:00","Wake up & get ready","personal"],
        ["08:00","08:30","Breakfast","personal"],
        ["08:30","10:00","Deep Learning Mathematics","learning"],
        ["10:10","11:30","CSCI 135 · Programming","class"],
        ["11:30","12:00","Snack & short break","personal"],
        ["12:10","13:00","MATH 156 · Calculus I","class"],
        ["13:00","13:30","Lunch","personal"],
        ["13:30","15:00","Learn DSA","learning"],
        ["15:00","16:00","Professor research","research"],
        ["16:10","17:00","ENGW 102 · Writing","class"],
        ["17:00","17:45","Dinner & rest","personal"],
        ["17:45","18:45","Assignments & class reading","homework"],
        ["19:00","20:00","Learn PyTorch","learning"],
        ["20:00","22:15","Free time · friends · reels","personal"],
        ["22:15","23:30","Wind down & night routine","personal"],
        ["23:30","07:30","Sleep","sleep","Until Tuesday morning"]
      ],
      // TUESDAY — 4 hours independent learning, 30 minutes homework, soccer
      [
        ["07:30","07:50","Wake up & get ready","personal"],
        ["07:50","08:10","Breakfast","personal"],
        ["08:10","09:00","Learn DSA","learning"],
        ["09:10","10:00","CSCI 120 · Exploring CS","class"],
        ["10:10","11:55","Learn PyTorch","learning"],
        ["12:10","13:00","MATH 156 · Calculus I","class"],
        ["13:00","13:30","Lunch","personal"],
        ["13:30","14:00","Assignments & reading","homework"],
        ["14:10","15:30","ECON 001 · Economics","class"],
        ["15:40","17:05","Deep Learning Mathematics","learning"],
        ["17:05","17:35","Light research / paper notes","research"],
        ["17:35","18:15","Dinner & soccer prep","personal"],
        ["18:30","21:00","Soccer","soccer"],
        ["21:00","21:40","Shower & snack","personal"],
        ["21:40","22:30","Relax · friends · reels","personal"],
        ["22:30","23:30","Night routine","personal"],
        ["23:30","07:30","Sleep","sleep","Until Wednesday morning"]
      ],
      // WEDNESDAY — 4 hours independent learning, 1 hour homework
      [
        ["07:30","08:00","Wake up & get ready","personal"],
        ["08:00","08:30","Breakfast","personal"],
        ["08:30","10:00","Learn DSA","learning"],
        ["10:10","11:30","CSCI 135 · Programming","class"],
        ["11:30","12:00","Snack & short break","personal"],
        ["12:10","13:00","MATH 156 · Calculus I","class"],
        ["13:00","13:40","Lunch","personal"],
        ["14:00","16:00","CSCI 135 · Programming Lab","class"],
        ["16:10","17:00","ENGW 102 · Writing","class"],
        ["17:00","17:45","Dinner & rest","personal"],
        ["17:45","19:15","Learn PyTorch","learning"],
        ["19:15","20:15","Assignments & class reading","homework"],
        ["20:15","21:15","Deep Learning Mathematics","learning"],
        ["21:15","22:30","Free time · unwind","personal"],
        ["22:30","23:30","Night routine","personal"],
        ["23:30","07:30","Sleep","sleep","Until Thursday morning"]
      ],
      // THURSDAY — 4 hours independent learning, 1 hour homework, ~2 hours research
      [
        ["07:30","08:00","Wake up & get ready","personal"],
        ["08:00","08:30","Breakfast","personal"],
        ["08:30","09:00","Learn DSA","learning"],
        ["09:10","10:00","CSCI 120 · Exploring CS","class"],
        ["10:10","11:40","Learn DSA","learning"],
        ["11:40","12:10","Lunch","personal"],
        ["12:10","14:00","Professor research","research"],
        ["14:10","15:30","ECON 001 · Economics","class"],
        ["15:40","17:40","Deep Learning Mathematics","learning"],
        ["17:40","18:20","Dinner & rest","personal"],
        ["18:20","19:20","Assignments & class reading","homework"],
        ["19:20","22:00","Free evening / optional meeting","personal","Research meeting only if confirmed"],
        ["22:00","23:30","Night routine & unwind","personal"],
        ["23:30","07:30","Sleep","sleep","Until Friday morning"]
      ],
      // FRIDAY — 4 hours independent learning, 30 minutes homework, soccer
      [
        ["07:30","08:00","Wake up & get ready","personal"],
        ["08:00","08:30","Breakfast","personal"],
        ["08:30","10:00","Deep Learning Mathematics","learning"],
        ["10:10","11:40","Learn PyTorch","learning"],
        ["12:10","13:00","MATH 156 · Calculus I","class"],
        ["13:00","13:30","Lunch","personal"],
        ["13:30","14:30","Learn DSA","learning"],
        ["14:30","15:30","Professor research","research"],
        ["15:30","16:00","Assignments & class reading","homework"],
        ["16:10","17:00","ENGW 102 · Writing","class"],
        ["17:00","18:10","Early dinner & soccer prep","personal"],
        ["18:30","21:00","Soccer","soccer"],
        ["21:00","22:15","Shower & relax","personal"],
        ["22:15","23:30","Free time & night routine","personal"],
        ["23:30","08:00","Sleep","sleep","Until Saturday morning"]
      ],
      // SATURDAY — 4 hours independent learning, 1 hour homework, 2 hours research
      [
        ["08:00","08:30","Wake up & get ready","personal"],
        ["08:30","09:00","Breakfast","personal"],
        ["09:00","11:00","Professor research","research"],
        ["11:00","11:20","Snack & break","personal"],
        ["11:20","13:20","Learn DSA","learning"],
        ["13:20","14:10","Lunch & rest","personal"],
        ["14:10","16:10","Learn PyTorch","learning"],
        ["16:10","17:10","Assignments & reading","homework"],
        ["17:10","19:00","Free time · friends · outdoors","personal"],
        ["19:00","20:00","Dinner","personal"],
        ["20:00","22:30","Relax · outings · reels","personal"],
        ["22:30","23:30","Night routine","personal"],
        ["23:30","08:30","Sleep","sleep","Until Sunday morning"]
      ],
      // SUNDAY — 4 hours independent learning, 1 hour homework, 2 hours research
      [
        ["08:30","09:00","Wake up & get ready","personal"],
        ["09:00","09:30","Breakfast","personal"],
        ["09:30","10:30","Assignments & Monday prep","homework"],
        ["10:30","12:30","Deep Learning Mathematics","learning"],
        ["12:30","13:30","Lunch & break","personal"],
        ["13:30","15:30","Learn DSA","learning"],
        ["15:30","17:30","Professor research","research"],
        ["17:30","18:30","Laundry, room & weekly reset","personal"],
        ["18:30","19:15","Dinner","personal"],
        ["19:15","21:15","Free time · friends · reels","personal"],
        ["21:15","22:00","Prepare for Monday","personal"],
        ["22:00","23:30","Night routine & unwind","personal"],
        ["23:30","07:30","Sleep","sleep","Until Monday morning"]
      ]
    ];

    const zone = "America/New_York";
    const weekDayIndex = {Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};
    const dayStrip = document.getElementById("dayStrip");
    const events = document.getElementById("events");
    const focusLabel = document.getElementById("focusLabel");
    const focusName = document.getElementById("focusName");
    const focusTime = document.getElementById("focusTime");
    const nextLabel = document.getElementById("nextLabel");
    const nextText = document.getElementById("nextText");
    const liveTag = document.getElementById("liveTag");
    const scheduleHeading = document.getElementById("scheduleHeading");
    const scheduleCount = document.getElementById("scheduleCount");
    const timeMinutes = value => { const [h,m] = value.split(":").map(Number); return h*60 + m; };
    const toClock = value => {
      const [h,m] = value.split(":").map(Number);
      const hour = h%12 || 12;
      return `${hour}:${String(m).padStart(2,"0")} ${h>=12?"PM":"AM"}`;
    };
    const timeRange = item => `${toClock(item[0])} – ${toClock(item[1])}`;
    const duration = item => {
      const start = timeMinutes(item[0]);
      let end = timeMinutes(item[1]);
      if (end <= start) end += 1440;
      return end - start;
    };
    const hoursLabel = minutes => {
      const hours = Math.floor(minutes/60); const mins = minutes%60;
      return [hours?`${hours}h`:"",mins?`${mins}m`:""].filter(Boolean).join(" ") || "0m";
    };
    function nowNY() {
      const parts = new Intl.DateTimeFormat("en-US", { timeZone:zone, weekday:"short", hour:"2-digit", minute:"2-digit", hourCycle:"h23" }).formatToParts(new Date());
      const data = Object.fromEntries(parts.map(part=>[part.type,part.value]));
      return { day:weekDayIndex[data.weekday], minutes:Number(data.hour)*60+Number(data.minute) };
    }
    function getCurrent(day,minutes) {
      const current = schedule[day].find(item=>timeMinutes(item[0])<=minutes && minutes<timeMinutes(item[0])+duration(item) );
      if (current) return current;
      // Before waking, the previous day's sleep is still active.
      const previous = schedule[(day+6)%7].at(-1);
      if (previous && previous[3]==="sleep" && minutes<timeMinutes(previous[1])) return previous;
      return null;
    }
    function getNext(day,minutes) { return schedule[day].find(item=>timeMinutes(item[0])>minutes) || null; }
    let selectedDay = nowNY().day;
    let followToday = true;
    function renderTabs() {
      const today = nowNY().day;
      dayStrip.replaceChildren();
      schedule.forEach((dayItems,index) => {
        const learning = dayItems.filter(x=>x[3]==="learning").reduce((sum,x)=>sum+duration(x),0);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "day";
        button.setAttribute("aria-pressed",String(selectedDay===index));
        button.setAttribute("aria-label",days[index] + ", " + hoursLabel(learning) + " independent learning");
        const name = document.createElement("span"); name.className="day-name"; name.textContent=days[index].slice(0,3);
        const sub = document.createElement("span"); sub.className="day-sub"; sub.textContent=hoursLabel(learning);
        button.append(name,sub);
        if (index===today) { const dot=document.createElement("span"); dot.className="today-dot"; dot.setAttribute("aria-hidden","true"); button.append(dot); }
        button.addEventListener("click",()=>{selectedDay=index;followToday=(index===nowNY().day);render();});
        dayStrip.append(button);
      });
    }
    function renderOverview() {
      for (const [key,label] of [["learning","learning"],["research","research"],["homework","homework"]]) {
        const minutes = schedule[selectedDay].filter(x=>x[3]===key).reduce((sum,x)=>sum+duration(x),0);
        document.getElementById(`${key}Total`).textContent = hoursLabel(minutes);
        document.getElementById(`${key}Bar`).style.width = `${Math.min(100,100*minutes/(key==="learning"?300:key==="research"?180:60))}%`;
      }
    }
    function renderEvents() {
      const {day:today,minutes} = nowNY();
      const isToday = today===selectedDay;
      const current = isToday?getCurrent(today,minutes):null;
      events.replaceChildren();
      for(const item of schedule[selectedDay]) {
        const row = document.createElement("div");
        row.className = `event type-${item[3]}` + (item===current?" is-current":"");
        const time=document.createElement("div"); time.className="time"; time.textContent=timeRange(item);
        const line=document.createElement("div"); line.className="line"; line.setAttribute("aria-hidden","true");
        const details=document.createElement("div");
        const title=document.createElement("div"); title.className="event-title"; title.textContent=item[2]; details.append(title);
        if(item[4]) {const note=document.createElement("span"); note.className="event-note"; note.textContent=item[4]; details.append(note);}
        row.append(time,line,details); events.append(row);
      }
      scheduleHeading.textContent = isToday?"Today's schedule":`${days[selectedDay]}'s schedule`;
      const count = schedule[selectedDay].filter(x=>x[3]==="class").length;
      scheduleCount.textContent = count?`${count} classes`:"No classes";
    }
    function renderFocus() {
      const {day:today,minutes} = nowNY();
      const isToday=today===selectedDay;
      const current=isToday?getCurrent(today,minutes):null;
      const upcoming=isToday?getNext(today,minutes):schedule[selectedDay][0];
      liveTag.hidden=!current;
      if(!isToday) {
        const first=schedule[selectedDay][0];
        focusLabel.textContent=`${days[selectedDay]} · first up`;
        focusName.textContent=first[2]; focusTime.textContent=timeRange(first);
        nextLabel.textContent="Later";
        nextText.textContent=schedule[selectedDay][1] ? `${schedule[selectedDay][1][2]} · ${toClock(schedule[selectedDay][1][0])}` : "Nothing else planned";
        return;
      }
      if(current){
        focusLabel.textContent="Right now";
        focusName.textContent=current[2]; focusTime.textContent=timeRange(current);
      }else{
        focusLabel.textContent="Right now";
        focusName.textContent="A little free time";
        focusTime.textContent="Nothing scheduled at the moment";
      }
      nextLabel.textContent="Up next";
      nextText.textContent=upcoming?`${upcoming[2]} · ${toClock(upcoming[0])}`:"Rest up — your day is complete";
    }
    function render() {renderTabs();renderFocus();renderEvents();renderOverview();}
    render();
    // One update per minute is enough for a schedule. No animation loop or heavy polling.
    setInterval(()=>{if(followToday) selectedDay=nowNY().day; renderTabs();renderFocus();renderEvents();renderOverview();},60_000);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden) render();});
  </script>
</body>
</html>
